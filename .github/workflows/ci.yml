name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Das Release-Gate diffed gegen den Basis-Branch — ohne dessen Historie
          # findet git den Merge-Base nicht.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: PowerShell-Syntax
        shell: pwsh
        run: |
          $failed = $false
          $scriptFiles = @(Get-ChildItem 'plugins' -Recurse -File -Filter '*.ps1' | Sort-Object FullName)
          if ($scriptFiles.Count -eq 0) { throw 'Keine PowerShell-Dateien in den Plugins gefunden.' }
          $scriptFiles | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            foreach ($parseError in $errors) {
              $relativePath = [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
              Write-Output "::error file=$relativePath,line=$($parseError.Extent.StartLineNumber),col=$($parseError.Extent.StartColumnNumber)::$($parseError.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Python-Syntax
        env:
          PYTHONPYCACHEPREFIX: /tmp/labi-python-cache
        run: python3 -m py_compile scripts/validate.py plugins/windows/skills/intune-win32/scripts/new_package.py

      - uses: astral-sh/setup-uv@v5
      - run: bun run validate

      - name: Release-Gate
        if: github.event_name == 'pull_request'
        # base_ref über env statt inline — ein Branchname darf $ und Backticks
        # enthalten und würde inline in der Shell ausgewertet.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          uv run --with pyyaml scripts/validate.py --release-gate "origin/$BASE_REF"

      - name: Release-Gate für direkten Push
        if: github.event_name == 'push'
        env:
          BASE_REF: ${{ github.event.before }}
        run: uv run --with pyyaml scripts/validate.py --release-gate "$BASE_REF"
